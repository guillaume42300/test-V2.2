plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.observateurbasket.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.observateurbasket.v2'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
